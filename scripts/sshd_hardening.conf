# Installato da install.sh in /etc/ssh/sshd_config.d/90-hardening.conf
# SSH raggiungibile solo da LAN/VPN (la porta 22 non va inoltrata sul router).
PermitRootLogin no
MaxAuthTries 3
AllowUsers pi offsite

# Utente "offsite" (dal 18/10/2026): solo il tunnel inverso del RPi4 di backup in un altra sede (rpi-backup/).
# Il RPi4 espone il suo rest-server su 172.20.0.1:18000 (gateway di shared_network), raggiungibile da Backrest.
# Niente shell, comandi, tty, agent o inoltri locali: solo quella porta in ascolto, solo con chiave.
# 127.0.0.1:10022 (dal 20/10/2026): SSH di manutenzione del RPi4, solo dal .30 stesso (ssh -J pi@192.168.1.100 -p 10022 pi@127.0.0.1).
# Ogni porta va permessa sia qui sia in offsite_authorized_keys (permitlisten): se manca in uno dei due sshd la rifiuta.
Match User offsite
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitListen 172.20.0.1:18000 172.20.0.1:17007 172.20.0.1:19001 127.0.0.1:10022
    PermitOpen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /usr/sbin/nologin
