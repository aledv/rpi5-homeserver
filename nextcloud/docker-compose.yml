services:
  nextcloud:
    image: nextcloud:35  # fissata il 27/09: aggiorna solo le patch
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "6789:80"
    volumes:
      - /mnt/external_drive/nextcloud/nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - REDIS_HOST=redis  # Aggiungi la configurazione per Redis
    depends_on:
      - db
      - redis  # Assicurati che Redis sia avviato prima di Nextcloud
    networks:
      - network

  db:
    image: mariadb:13.0  # fissata il 27/09: Watchtower non fa salti di versione maggiore
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    container_name: nextcloud_db
    restart: unless-stopped
    volumes:
      - /mnt/external_drive/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    mem_limit: 2g
    networks:
      - network

  redis:
    image: redis:8  # fissata il 27/09: aggiorna solo le patch
    container_name: nextcloud_redis
    restart: unless-stopped
    volumes:
      - /mnt/external_drive/nextcloud/redis_data:/data
    expose:
      - "6379"  # Esponi la porta 6379 per la comunicazione con Nextcloud
    networks:
      - network

networks:
  network:
    driver: bridge
