services:
  nextcloud:
    image: nextcloud:35@sha256:8de31d1ba6d670b1e60052e8a2b4715a3cf5c05fc69baf3786f265703efe285e  # aggiornata in automatico il 20/11/2026 (era 35@8041f24690c5…)
    container_name: nextcloud
    healthcheck:  # aggiunto il 21/10/2026: Kuma e homepage vedono se risponde, non solo se è acceso
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q installed.:true"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "6789:80"
    volumes:
      - /mnt/external_drive/nextcloud/nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - REDIS_HOST=redis  # Aggiungi la configurazione per Redis
    depends_on:
      - db
      - redis  # Assicurati che Redis sia avviato prima di Nextcloud
    networks:
      - network

  db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc  # aggiornata in automatico il 20/11/2026 (era 11.8.9@d36f18d65a04…)
    # 29/09/2026: niente binlog (nessuna replica; crescevano senza limite), slow query log e redo log 128 MB (controlli di Nextcloud); 13/10/2026: buffer pool 1 GB (era 128 MB); 25/10/2026: tabelle temporanee in memoria fino a 64 MB (29% finivano su disco)
    command: --transaction-isolation=READ-COMMITTED --skip-log-bin --slow-query-log=1 --long-query-time=2 --innodb-log-file-size=128M --innodb-buffer-pool-size=1G --tmp-table-size=64M --max-heap-table-size=64M
    container_name: nextcloud_db
    healthcheck:  # aggiunto il 21/10/2026: Kuma e homepage vedono se risponde, non solo se è acceso
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - /mnt/external_drive/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    mem_limit: 2g
    networks:
      - network

  redis:
    image: redis:8@sha256:2ee7f331f951b15cc747dbd1512121be5db20f2d062d9746f19a0dada2b18edd  # aggiornata in automatico il 24/11/2026 (era 8@1f88291b4c57…)
    container_name: nextcloud_redis
    healthcheck:  # aggiunto il 21/10/2026: Kuma e homepage vedono se risponde, non solo se è acceso
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - /mnt/external_drive/nextcloud/redis_data:/data
    expose:
      - "6379"  # Esponi la porta 6379 per la comunicazione con Nextcloud
    networks:
      - network

networks:
  network:
    driver: bridge
