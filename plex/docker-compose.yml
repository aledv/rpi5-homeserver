services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls325@sha256:be083133dfe001b6caed5a321720e6db9d38fdde1ea8f9d29340d40057a7fa53  # fissata il 29/09/2026 (era lscr.io/linuxserver/plex:latest)
    #ports:
    #  - "32400:32400"
    container_name: plex
    healthcheck:  # aggiunto il 21/10/2026: Kuma e homepage vedono se risponde, non solo se è acceso
      test: ["CMD-SHELL", "curl -fsS http://localhost:32400/identity >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
      - PLEX_CLAIM=claim-etGurua2PyY8hRzJga9j
    volumes:
      - /mnt/external_drive/plex:/config
      - /mnt/external_drive/Music:/data/Music
      - /mnt/external_drive/Movies:/data/Movies
      - /mnt/external_drive/SerieTV:/data/SerieTV
    restart: unless-stopped
