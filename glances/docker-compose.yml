services:
  glances:
    image: nicolargo/glances:4.5.9@sha256:1d994d181732cfbf68b7c5826a1f71b89624e3eaaa2fe28b28048b2f61b200d7  # aggiornata in automatico il 08/11/2026 (era 4.5.8@32ccbc559baa…)
    container_name: glances
    restart: unless-stopped
    network_mode: host
    environment:
      - GLANCES_OPT=-w
      - DOCKER_HOST=tcp://127.0.0.1:2375   # docker dell host in sola lettura (docker-socket-proxy)
    pid: "host"
    volumes:
      - /mnt/external_drive/glances:/glances/conf
      - /mnt/external_drive:/mnt/external_drive:ro
