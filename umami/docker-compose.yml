services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc  # aggiornata in automatico il 12/11/2026 (era postgresql-latest@e69d1a7932e9…)
    container_name: umami
    ports:
      - "3004:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET} 
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://umami.${DOMAIN}/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s      

  db:
    image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d  # aggiornata in automatico il 19/11/2026 (era 15-alpine@23799e521dee…)
    container_name: umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
    volumes:
      - /mnt/external_drive/umami/db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

networks:
  network:
    driver: bridge
