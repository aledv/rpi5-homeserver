services:
  mosquitto:
    image: eclipse-mosquitto:latest@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4  # aggiornata in automatico il 18/11/2026 (era latest@75d6662dee52…)
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"  # Porta MQTT standard
      - "9001:9001"  # Porta WebSocket (opzionale)
    volumes:
      - /mnt/external_drive/mosquitto/config:/mosquitto/config
      - /mnt/external_drive/mosquitto/data:/mosquitto/data
      - /mnt/external_drive/mosquitto/log:/mosquitto/log
    environment:
      - TZ=Europe/Rome
    networks:
      - shared_network
    
networks:
  shared_network:
    external: true      
