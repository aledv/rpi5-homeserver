services:
  mosquitto:
    image: eclipse-mosquitto:latest@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f  # aggiornata in automatico il 24/10/2026 (era latest@847b8594cd49…)
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"  # Porta MQTT standard
      - "9001:9001"  # Porta WebSocket (opzionale)
    volumes:
      - /mnt/external_drive/mosquitto/config:/mosquitto/config
      - /mnt/external_drive/mosquitto/data:/mosquitto/data
      - /mnt/external_drive/mosquitto/log:/mosquitto/log
    environment:
      - TZ=Europe/Rome
    networks:
      - shared_network
    
networks:
  shared_network:
    external: true      
