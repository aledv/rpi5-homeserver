services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18  # aggiornata in automatico il 12/11/2026 (era v2.7.0@19c5c0918445…)
    container_name: homepage
    dns:
      - 192.168.1.100
    ports:
      - 3002:3000
    volumes:
      - /mnt/external_drive/homepage:/app/config # Make sure your local config directory exists
    env_file: .env # HOMEPAGE_VAR_* usate in services.yaml (escluso da git)
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${DOMAIN} # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    restart: unless-stopped
    networks:
      - shared_network

networks:
  shared_network:
    external: true
