services:
  app:
    image: 'jc21/nginx-proxy-manager:2'  # fissata il 27/09: aggiorna solo le patch
    container_name: nginx-proxy-manager
    restart: unless-stopped
    depends_on:
      - nginx_db
    network_mode: host  # Usa la rete dell'host
    environment:
      DB_MYSQL_HOST: "127.0.0.1"  # Deve essere 127.0.0.1 perché "db" non è più risolvibile su host
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
      DB_MYSQL_NAME: "npm"
    volumes:
      - /mnt/external_drive/nginx-proxy-manager/data:/data
      - /mnt/external_drive/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      
  nginx_db:
    image: 'jc21/mariadb-aria:10.11.5'  # fissata il 27/09
    container_name: nginx-proxy-manager_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /mnt/external_drive/nginx-proxy-manager/mysql:/var/lib/mysql
    networks:
      - shared_network
    ports:
      - "3306:3306"  # Espone MariaDB sull'host

networks:
  shared_network:
    external: true  # La rete deve già esistere