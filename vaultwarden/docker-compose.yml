services:
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055  # aggiornata in automatico il 14/10/2026 (era 1.37.3@1587c45feaa4…)
    container_name: vaultwarden
    restart: always
    environment:
      - SIGNUPS_ALLOWED=false   # 27/09: niente registrazioni pubbliche (il servizio è esposto su internet)
    ports:
      - "9283:80"
    volumes:
      - /mnt/external_drive/vaultwarden:/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true 
