services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f  # aggiornata in automatico il 02/11/2026 (era 1.37.4@efb3cde96201…)
    container_name: vaultwarden
    restart: always
    environment:
      - SIGNUPS_ALLOWED=false   # 27/09: niente registrazioni pubbliche (il servizio è esposto su internet)
    ports:
      - "9283:80"
    volumes:
      - /mnt/external_drive/vaultwarden:/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true 
