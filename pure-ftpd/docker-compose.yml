services:
  pure-ftpd:
    image: gists/pure-ftpd:latest@sha256:4de79a4a576cd428818b1938e96ef92cd14c4b732dc762efaec16b87e2049fff  # fissata il 29/09/2026 (era gists/pure-ftpd)
    container_name: pure-ftpd
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    environment:
      - PUBLIC_HOST=192.168.1.100
    volumes:
      - /mnt/external_drive/pure-ftpd/data:/home/ftpuser
      - /mnt/external_drive/pure-ftpd/pureftpd:/etc/pureftpd
    restart: always
    networks:
      - shared_network

networks:
  shared_network:
    external: true  
    