services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a  # aggiornata in automatico il 18/11/2026 (era 2.5.11@7554dba313c8…)
    container_name: uptime-kuma
    restart: always
    dns:
      - 192.168.1.100
    ports:
      - "3001:3001"
    volumes:
      - /mnt/external_drive/uptime-kuma:/app/data
      # docker dell host: host "Docker@RPi5" in Kuma = tcp://docker-socket-proxy:2375 (sola lettura)
    networks:
      - shared_network

networks:
  shared_network:
    external: true 
