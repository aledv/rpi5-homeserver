services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    dns:
      - 192.168.1.100
    ports:
      - "3001:3001"
    volumes:
      - /mnt/external_drive/uptime-kuma:/app/data
      # docker del .30: host "Docker@RPi5" in Kuma = tcp://docker-socket-proxy:2375 (sola lettura)
    networks:
      - shared_network

networks:
  shared_network:
    external: true 
