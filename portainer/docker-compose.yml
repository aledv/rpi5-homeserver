services:
  portainer:
    image: portainer/portainer-ce:2.45.4@sha256:18616fff2998f8ca0e8ebe7f028658ae1682859cf43f212f81a849c1093ad639  # aggiornata in automatico il 19/11/2026 (era 2.45.3@3609c307943b…)
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/external_drive/portainer:/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true 
