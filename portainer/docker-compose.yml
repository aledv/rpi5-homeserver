services:
  portainer:
    image: portainer/portainer-ce:2.45.1  # versione fissata
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/external_drive/portainer:/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true 