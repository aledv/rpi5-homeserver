services:
  openvpn-as:
    image: openvpn/openvpn-as:3.2.3-8444f22d-Ubuntu26@sha256:921b38fb12d2ee5517cd8281615dc6ae0d1b570e414fc892f909ba30b7c91bfd  # 14/10/2026: aggiornata a mano con approvazione dell utente (era 3.2.2-413ca39f-Ubuntu24@2253c10ec652)
    container_name: openvpn-as
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - MKNOD
    ports:
      - 943:943
      #- 443:443
      - 41194:41194/udp
    volumes:
      - /mnt/external_drive/openvpn:/openvpn
    networks:
      - network
    restart: unless-stopped

networks:
  network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.101.0.0/24  # 25/11/2026: era 172.101.0.0/24 (indirizzi pubblici: Plex trattava i client VPN come remoti)
