services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v11.3.5@sha256:dd09e6aaa9d5ad686b6017427a502c40dc862ba28445609813e5ea1f66f6dbdf  # aggiornata in automatico il 25/10/2026 (era v11.3.4@8796ae7e1ecb…)
    restart: unless-stopped # senza, dopo un aggiornamento o un riavvio resta fermo
    environment:
      # DOZZLE_REMOTE_AGENT: 192.168.1.101:7007   # opzionale: agent Dozzle su altri host, separati da virgola
      DOCKER_HOST: tcp://docker-socket-proxy:2375 # docker dell host in sola lettura
    volumes:
      - /mnt/external_drive/dozzle_data:/data
    ports:
      - 8890:8080
    networks:
      - shared_network

networks:
  shared_network:
    external: true
